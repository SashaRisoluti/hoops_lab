# Advanced stack (Phase 4+) ONLY — the MVP runs fully local on DuckDB and
# does NOT need Docker. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hoops
      POSTGRES_PASSWORD: hoops
      POSTGRES_DB: hoops_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
