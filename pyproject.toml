[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hoops-lab"
version = "0.1.0"
description = "Modular NBA data-science framework: historical analysis, pre-game scouting, live game intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sasha Risoluti" }]
keywords = ["nba", "basketball", "sports-analytics", "data-science", "streamlit"]

# MVP stack (Phases 1-3). The advanced stack (FastAPI, PostgreSQL, Redis,
# Celery) is added incrementally from Phase 4 onwards.
dependencies = [
    "nba_api>=1.4",
    "pandas>=2.1",
    "polars>=1.0",
    "duckdb>=1.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "altair>=5.0",
    "minisom>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["hoops_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML template builders: long inline-style strings are clearer unwrapped.
"dashboard/components/overview_cards.py" = ["E501"]
"dashboard/components/theme.py" = ["E501"]
