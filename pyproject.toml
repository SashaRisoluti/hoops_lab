[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hoops-lab"
version = "0.1.0"
description = "Modular NBA data-science framework: historical analysis, pre-game scouting, live game intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sasha Risoluti" }]
keywords = ["nba", "basketball", "sports-analytics", "data-science", "streamlit"]

# Floors only; requirements.txt pins the exact deploy set.
dependencies = [
    "nba_api>=1.4",
    "pandas>=2.1",
    "polars>=1.0",
    "duckdb>=1.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "altair>=5.0",
    "minisom>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[tool.setuptools.packages.find]
include = ["hoops_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["hoops_lab", "scripts", "dashboard", "app.py", "tests"]
# scripts/ and dashboard/ are folders run from the repo root, not installed packages.
explicit_package_bases = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["sklearn.*", "nba_api.*", "minisom.*", "scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML template builders: long inline-style strings are clearer unwrapped.
"dashboard/components/overview_cards.py" = ["E501"]
"dashboard/components/theme.py" = ["E501"]
